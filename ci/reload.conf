# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_STREAM  directives for a stream block, may be empty
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# The module keeps its peers in a shared memory zone, and a zone is exactly
# the kind of thing a reload can lose: the name and the size have to match
# the previous cycle for nginx to keep it.  dynamic_upstream reads that zone
# to answer, so a reload that dropped it would stop listing the peer -- the
# probe asks for the one thing only a live zone can produce.

RELOAD_STREAM=""

RELOAD_HTTP="
    upstream reload_backends {
        zone reload_backends 128k;
        server 127.0.0.1:19101;
    }"

RELOAD_SERVER="
        location /probe {
            dynamic_upstream;
        }"

RELOAD_EXPECT='127.0.0.1:19101'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe?upstream=reload_backends" |
		sed -n 's/.*\(127\.0\.0\.1:19101\).*/\1/p'
}
